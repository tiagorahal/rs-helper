<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>rs-helper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif; margin: 24px; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); align-items: end; }
      label { font-size: 12px; color: #444; display: block; margin-bottom: 4px; }
      input, select, button { padding: 8px 10px; font-size: 14px; }
      .row { display:flex; gap:8px; align-items:center; }
      .results { margin-top: 16px; }
      .card { display:flex; gap: 12px; align-items:center; border:1px solid #eee; padding:10px; border-radius:8px; }
      .muted { color:#666; font-size:12px; }
      .error { color: #b00020; padding: 8px; border: 1px solid #b00020; border-radius: 6px; background:#fff5f6; }
      img.icon { width: 32px; height: 32px; image-rendering: pixelated; }
      .tag { font-size: 11px; color:#555; background:#f3f3f3; padding:2px 6px; border-radius: 999px; }
      .price { font-weight: 600; }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
