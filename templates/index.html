{% extends "base.html" %}
{% block content %}
  <h1>rs-helper</h1>
  <p class="muted">Search items and filter by category/letter. Results are server-rendered and sanitized.</p>

  <form class="grid"
        hx-get="/ui/ge/items"
        hx-target="#results"
        hx-trigger="submit, change, keyup changed delay:300ms from:#q"
        hx-include="this">

    <div>
      <label for="q">Search</label>
      <input id="q" name="q" type="text" placeholder="Item name (e.g., boots)" />
    </div>

    <div>
      <label for="category">Category</label>
      <select id="category" name="category">
        {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label for="alpha">Letter</label>
      <select id="alpha" name="alpha">
        <option value="a">a</option>
        <option value="b">b</option>
        <option value="c">c</option>
        <option value="d">d</option>
        <option value="e">e</option>
        <option value="f">f</option>
        <option value="g">g</option>
        <option value="h">h</option>
        <option value="i">i</option>
        <option value="j">j</option>
        <option value="k">k</option>
        <option value="l">l</option>
        <option value="m">m</option>
        <option value="n">n</option>
        <option value="o">o</option>
        <option value="p">p</option>
        <option value="q">q</option>
        <option value="r">r</option>
        <option value="s">s</option>
        <option value="t">t</option>
        <option value="u">u</option>
        <option value="v">v</option>
        <option value="w">w</option>
        <option value="x">x</option>
        <option value="y">y</option>
        <option value="z">z</option>
        <option value="#">#</option>
      </select>
    </div>

    <div>
      <label>&nbsp;</label>
      <button type="submit">Search</button>
    </div>
  </form>

  <div class="results" id="results">
    <!-- results partial renders here -->
  </div>
{% endblock %}
