{% extends "base.html" %}
{% block content %}
  <header>
    <h1>rs-helper</h1>
    <div class="muted">CORS-safe RuneScape data. Type an item name and press <strong>Search</strong>.</div>
  </header>

  <form id="search"
        class="grid"
        hx-get="/ui/ge/items"
        hx-target="#results"
        hx-trigger="submit"
        hx-indicator="#global-indicator">

    <div>
      <label for="q">Search</label>
      <input id="q" name="q" type="text" placeholder="e.g., boots" autofocus />
    </div>

    <div>
      <label>&nbsp;</label>
      <button class="btn" type="submit">Search</button>
    </div>

    <input id="page" name="page" type="hidden" value="1" />
  </form>

  <div id="global-indicator" class="htmx-indicator" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <span>Carregando dados da API…</span>
  </div>

  <div class="results" id="results" hx-indicator="#global-indicator">
  </div>
{% endblock %}
